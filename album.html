<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой фотоальбом</title>
    <link href="dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #2c3e50;
            display: flex;
            justify-content: center;
        }
        .book-container {
            width: 100%;
            max-width: 1000px;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <div class="_df_book" source="album.pdf" id="flipbook" disableRange="true"></div>
    

    <script src="dflip/js/libs/jquery.min.js" type="text/javascript"></script>
    <script src="dflip/js/dflip.min.js" type="text/javascript"></script>
<script>
jQuery(function($){
    // Ждем, пока книга будет готова
    DEARFLIP.defaults.onReady = function(flipbook) {
        // Проверяем, что это наша встроенная книга (а не всплывающее окно)
        if (flipbook.options.isLightBox !== true) {
            
            // Создаем кнопку "Назад"
            var prevBtn = jQuery('<div class="df-ui-btn df-icon-arrow-left" title="Назад"></div>');
            prevBtn.on("click", function(){ flipbook.prev(); });
            
            // Создаем кнопку "Вперед"
            var nextBtn = jQuery('<div class="df-ui-btn df-icon-arrow-right" title="Вперед"></div>');
            nextBtn.on("click", function(){ flipbook.next(); });
            
            // Вставляем кнопки в панель управления, рядом с номером страницы
            // (если pageNumber не существует, они вставятся в общую панель)
            if (flipbook.ui && flipbook.ui.pageNumber) {
                flipbook.ui.pageNumber.before(prevBtn);
                flipbook.ui.pageNumber.after(nextBtn);
            }
        }
    };
});
</script>
</body>
</html>
