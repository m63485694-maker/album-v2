<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой фотоальбом</title>
    <link href="dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .book-container {
            width: 100%;
            max-width: 1000px;
            /* Ограничиваем высоту, чтобы книга не прыгала */
            height: 80vh; 
        }
    </style>
</head>
<body>

    <div class="book-container">
        <!-- Возвращаем стандартные настройки. Никаких 100vh и pageMode -->
        <div class="_df_book" source="album.pdf" id="flipbook" webgl="true"></div>
    </div>

    <script src="dflip/js/libs/jquery.min.js" type="text/javascript"></script>
    <script src="dflip/js/dflip.min.js" type="text/javascript"></script>

    <script>
        // Этот скрипт просто ждет загрузки и включает полноэкранный режим
        // (Браузер разрешит это, так как вы уже взаимодействуете со страницей)
        jQuery(document).ready(function($) {
            setTimeout(function() {
                // Находим кнопку полноэкранного режима внутри DearFlip и "нажимаем" её
                var fsBtn = $('.df-ui-btn.df-icon-expand');
                if (fsBtn.length > 0) {
                    fsBtn.trigger('click');
                }
            }, 1000); // Ждем 1 секунду, чтобы книга прогрузилась
        });
    </script>

</body>
</html>
