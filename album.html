<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой фотоальбом</title>
    <link href="dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* Обертка, чтобы позиционировать кнопки относительно книги */
        .book-wrapper {
            position: relative; 
            width: 100%;
            max-width: 1000px;
        }
        /* Стили для наших кнопок */
        .custom-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            font-size: 30px;
            color: #2c3e50;
            cursor: pointer;
            z-index: 9999; /* Чтобы были поверх книги */
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            user-select: none;
        }
        .custom-arrow:hover {
            background: #fff;
            transform: translateY(-50%) scale(1.1);
        }
        .arrow-left { left: -80px; }
        .arrow-right { right: -80px; }

        /* На узких экранах сдвигаем кнопки внутрь, чтобы не улетали за край */
        @media (max-width: 1200px) {
            .arrow-left { left: 10px; }
            .arrow-right { right: 10px; }
        }
    </style>
</head>
<body>

    <div class="book-wrapper">
        <!-- Сама книга -->
        <div class="_df_book" source="album.pdf" id="flipbook" disableRange="true"></div>
        
        <!-- Наши кнопки -->
        <button class="custom-arrow arrow-left" id="btn-prev">❮</button>
        <button class="custom-arrow arrow-right" id="btn-next">❯</button>
    </div>

    <script src="dflip/js/libs/jquery.min.js" type="text/javascript"></script>
    <script src="dflip/js/dflip.min.js" type="text/javascript"></script>
    
    <script>
        // Ждем загрузки страницы
        jQuery(document).ready(function($) {
            
            // Переменная для хранения объекта книги
            var myFlipbook = null;

            // Функция, которая выполнится, когда книга будет готова
            window.dFlipReady = function(flipbook) {
                myFlipbook = flipbook;
            };

            // Обработчики кликов для наших кнопок
            $('#btn-prev').on('click', function() {
                if (myFlipbook) {
                    myFlipbook.prev();
                }
            });

            $('#btn-next').on('click', function() {
                if (myFlipbook) {
                    myFlipbook.next();
                }
            });
        });
    </script>

</body>
</html>
